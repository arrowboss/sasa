<!-- underwritingFlow.html -->
<template>
    <div class="uw-root">
        <div class="uw-container">

            <!-- LOADING -->
           
<template if:true={isLoading}>
    <div class="uw-loader-wrapper">
        <div class="uw-loader-card">
            
            <lightning-spinner 
                size="large" 
                alternative-text="Loading">
            </lightning-spinner>

            <!-- Optional Progress Bar -->
            <div class="uw-progress">
                <div class="uw-progress-bar"></div>
            </div>

        </div>
    </div>
</template>


            <!-- ERROR -->
            <template if:true={hasError}>
                <div class="uw-state-box">
                    <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                        <span class="slds-assistive-text">Error</span>
                        <h2>{errorMessage}</h2>
                    </div>
                    <lightning-button label="Retry" variant="brand" onclick={onRetry} class="slds-m-top_medium"></lightning-button>
                </div>
            </template>

            <!-- FORM -->
            <template if:true={isReady}>
                <div class="uw-body slds-p-around_medium slds-theme_default">

                    <!-- PATH -->
                    <div class="slds-path slds-m-top_large slds-m-bottom_medium">
                        <div class="slds-grid slds-path__track">
                            <div class="slds-grid slds-path__scroller-container">
                                <div class="slds-path__scroller">
                                    <div class="slds-path__scroller_inner">
                                        <ul class="slds-path__nav" role="tablist">
                                            <li class={pathClass1} role="presentation">
                                                <a class="slds-path__link" role="tab" data-page="1" onclick={onStepClick} tabindex="0">
                                                    <span class="slds-path__stage">
                                                        <lightning-icon icon-name="utility:check" size="x-small" alternative-text="complete"></lightning-icon>
                                                    </span>
                                                    <span class="slds-path__title">Analysis</span>
                                                </a>
                                            </li>
                                            <li class={pathClass2} role="presentation">
                                                <a class="slds-path__link" role="tab" data-page="2" onclick={onStepClick} tabindex="-1">
                                                    <span class="slds-path__stage">
                                                        <lightning-icon icon-name="utility:check" size="x-small" alternative-text="complete"></lightning-icon>
                                                    </span>
                                                    <span class="slds-path__title">Site Visit</span>
                                                </a>
                                            </li>
                                            <li class={pathClass3} role="presentation">
                                                <a class="slds-path__link" role="tab" data-page="3" onclick={onStepClick} tabindex="-1">
                                                    <span class="slds-path__stage">
                                                        <lightning-icon icon-name="utility:check" size="x-small" alternative-text="complete"></lightning-icon>
                                                    </span>
                                                    <span class="slds-path__title">Credit Memo</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- PAGE 1 -->
                    <template if:true={isPage1}>
                        <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                            <template for:each={currentSections} for:item="section">
                                <lightning-accordion-section key={section.key} name={section.key} label={section.accordionLabel} class="uw-acc-section">

                                    <template if:true={section.isEmpDemo}>
                                        <div class="slds-p-around_small">
                                            <div class="slds-media slds-media_center slds-m-bottom_small">
                                                <div class="slds-media__figure">
                                                    <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                                </div>
                                                <div class="slds-media__body">
                                                    <p class="slds-text-title_bold">Employee Demographics</p>
                                                    <p class="slds-text-body_small slds-text-color_weak">For statistical purposes only</p>
                                                </div>
                                            </div>

                                            <template if:true={hasEmpDemoRows}>
                                                <div style="display:block;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;">
                                                    <table style="min-width:660px;width:100%;border-collapse:collapse;" class="slds-table slds-table_bordered slds-table_col-bordered">
                                                        <thead>
                                                            <tr style="background:#f4f6f9;">
                                                                <th style="width:140px;padding:6px 8px;font-size:12px;font-weight:700;color:#16325c;border:1px solid #dddbda;">Race And Ethnicity</th>
                                                                <th style="width:88px;padding:6px 4px;font-size:12px;font-weight:700;color:#16325c;text-align:center;border:1px solid #dddbda;">Native American</th>
                                                                <th style="width:88px;padding:6px 4px;font-size:12px;font-weight:700;color:#16325c;text-align:center;border:1px solid #dddbda;">Asian / Pacific Islander</th>
                                                                <th style="width:88px;padding:6px 4px;font-size:12px;font-weight:700;color:#16325c;text-align:center;border:1px solid #dddbda;">Caucasian</th>
                                                                <th style="width:88px;padding:6px 4px;font-size:12px;font-weight:700;color:#16325c;text-align:center;border:1px solid #dddbda;">African American</th>
                                                                <th style="width:88px;padding:6px 4px;font-size:12px;font-weight:700;color:#16325c;text-align:center;border:1px solid #dddbda;">Latinx</th>
                                                                <th style="width:80px;padding:6px 4px;font-size:12px;font-weight:700;color:#16325c;text-align:center;border:1px solid #dddbda;">Other</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            <template for:each={empDemoRows} for:item="row" for:index="idx">
                                                                <tr key={row.Id} class="slds-hint-parent">
                                                                    <td style="padding:4px 8px;font-size:13px;border:1px solid #dddbda;white-space:nowrap;">{row.Race_And_Ethinicity__c}</td>
                                                                    <td style="padding:2px;border:1px solid #dddbda;">
                                                                        <lightning-input type="number" variant="label-hidden" label="Native American" name="nativeAmerican" value={row.Native_American__c} onchange={onEmpDemoChange} data-id={idx}></lightning-input>
                                                                    </td>
                                                                    <td style="padding:2px;border:1px solid #dddbda;">
                                                                        <lightning-input type="number" variant="label-hidden" label="Asian/Pacific Islander" name="pacificIslander" value={row.Asian_Pacific_Islander__c} onchange={onEmpDemoChange} data-id={idx}></lightning-input>
                                                                    </td>
                                                                    <td style="padding:2px;border:1px solid #dddbda;">
                                                                        <lightning-input type="number" variant="label-hidden" label="Caucasian" name="caucasian" value={row.Caucasian__c} onchange={onEmpDemoChange} data-id={idx}></lightning-input>
                                                                    </td>
                                                                    <td style="padding:2px;border:1px solid #dddbda;">
                                                                        <lightning-input type="number" variant="label-hidden" label="African American" name="africanAmerican" value={row.African_American__c} onchange={onEmpDemoChange} data-id={idx}></lightning-input>
                                                                    </td>
                                                                    <td style="padding:2px;border:1px solid #dddbda;">
                                                                        <lightning-input type="number" variant="label-hidden" label="Latinx" name="latinx" value={row.Latinx__c} onchange={onEmpDemoChange} data-id={idx}></lightning-input>
                                                                    </td>
                                                                    <td style="padding:2px;border:1px solid #dddbda;">
                                                                        <lightning-input type="number" variant="label-hidden" label="Other" name="other" value={row.Other__c} onchange={onEmpDemoChange} data-id={idx}></lightning-input>
                                                                    </td>
                                                                </tr>
                                                            </template>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </template>

                                            <template if:false={hasEmpDemoRows}>
                                                <p class="uw-empty-msg">No Employee Demographics records found for this loan.</p>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:true={section.isEmpty}>
                                        <p class="uw-empty-msg slds-p-around_medium">{section.emptyMsg}</p>
                                    </template>

                                    <template if:true={section.isFieldSet}>
                                        <div class="slds-grid slds-wrap slds-gutters slds-p-around_small">
                                            <template for:each={section.fields} for:item="field">
                                                <div key={field.uid} class={field.colCss}>

                                                    <template if:true={field.isLookup}>
                                                        <lightning-record-picker
                                                            label={field.label}
                                                            object-api-name="User"
                                                            value={field.value}
                                                            required={field.required}
                                                            disabled={field.isDisabled}
                                                            data-obj={field.objectApiName}
                                                            data-fld={field.apiName}
                                                            onchange={onLookupChange}>
                                                        </lightning-record-picker>
                                                    </template>

                                                    <template if:true={field.isText}>
                                                        <lightning-input label={field.label} type={field.inputType} value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isNumber}>
                                                        <lightning-input label={field.label} type="number" value={field.value} required={field.required} disabled={field.isDisabled} formatter={field.formatter} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isBoolean}>
                                                        <lightning-input label={field.label} type="checkbox" checked={field.boolVal} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onCheckbox}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isDate}>
                                                        <lightning-input label={field.label} type="date" value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isDatetime}>
                                                        <lightning-input label={field.label} type="datetime-local" value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isTextarea}>
                                                        <lightning-textarea label={field.label} value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-textarea>
                                                    </template>

                                                    <template if:true={field.isPicklist}>
                                                        <lightning-combobox label={field.label} value={field.value} options={field.picklistOptions} required={field.required} disabled={field.isDisabled} placeholder="— Select —" data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-combobox>
                                                    </template>

                                                    <template if:true={field.isMultiPicklist}>
                                                        <lightning-dual-listbox label={field.label} source-label="Available" selected-label="Selected" options={field.picklistOptions} value={field.multiVal} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onMultiPicklist}></lightning-dual-listbox>
                                                    </template>

                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <!-- TYPE D: Guarantor / Borrower Ownership table -->
<template if:true={section.isGuarantorTable}>
    <template if:true={section.isEmpty}>
        <p class="uw-empty-msg slds-p-around_medium">No records found for this loan.</p>
    </template>
    <template if:false={section.isEmpty}>
        <div style="overflow-x:auto;width:100%;padding:8px;">
            <table style="min-width:700px;width:100%;border-collapse:collapse;" class="slds-table slds-table_bordered slds-table_col-bordered">
                <thead>
                    <tr style="background:#f4f6f9;">
                        <th style="padding:6px 8px;font-size:12px;font-weight:700;color:#16325c;border:1px solid #dddbda;white-space:nowrap;">
                            <template if:true={section.isBorrower}>Principal Name</template>
                            <template if:false={section.isBorrower}>Guarantor</template>
                        </th>
                        <template if:true={section.isBorrower}>
                            <th style="padding:6px 8px;font-size:12px;font-weight:700;color:#16325c;border:1px solid #dddbda;">Ownership %</th>
                        </template>
                        <th style="padding:6px 8px;font-size:12px;font-weight:700;color:#16325c;border:1px solid #dddbda;">Credit Score</th>
                        <th style="padding:6px 8px;font-size:12px;font-weight:700;color:#16325c;border:1px solid #dddbda;">Title</th>
                        <th style="padding:6px 8px;font-size:12px;font-weight:700;color:#16325c;border:1px solid #dddbda;">Mgmt Exp (Yrs)</th>
                        <th style="padding:6px 8px;font-size:12px;font-weight:700;color:#16325c;border:1px solid #dddbda;">Type of Guarantee</th>
                        <template if:true={section.isBorrower}>
                            <th style="padding:6px 8px;font-size:12px;font-weight:700;color:#16325c;border:1px solid #dddbda;text-align:center;">Primary Owner</th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={section.guarantorRows} for:item="row" for:index="rowIdx">
                        <tr key={row.Id} class="slds-hint-parent">
                            <!-- Name: read-only display -->
                            <td style="padding:6px 8px;font-size:13px;border:1px solid #dddbda;white-space:nowrap;font-weight:500;">
                                {row.DisplayName}
                            </td>
                            <!-- Ownership % — borrower only -->
                            <template if:true={section.isBorrower}>
                                <td style="padding:2px;border:1px solid #dddbda;">
                                    <lightning-input type="number" variant="label-hidden" label="Ownership"
                                        value={row.Ownership__c}
                                        data-fld="Ownership__c"
                                        data-type={section.guarantorType}
                                        data-id={rowIdx}
                                        onchange={onGuarantorChange}>
                                    </lightning-input>
                                </td>
                            </template>
                            <!-- Credit Score: read-only (from Business Owner) -->
                            <td style="padding:6px 8px;font-size:13px;border:1px solid #dddbda;">{row.Credit_Score__c}</td>
                            <!-- Title -->
                            <td style="padding:2px;border:1px solid #dddbda;">
                                <lightning-input type="text" variant="label-hidden" label="Title"
                                    value={row.Title__c}
                                    data-fld="Title__c"
                                    data-type={section.guarantorType}
                                    data-id={rowIdx}
                                    onchange={onGuarantorChange}>
                                </lightning-input>
                            </td>
                            <!-- Mgmt Exp: read-only (from Business Owner) -->
                            <td style="padding:6px 8px;font-size:13px;border:1px solid #dddbda;">{row.BO_Mgmt_Exp_Yrs__c}</td>
                            <!-- Type of Guarantee -->
                           <td style="padding:2px;border:1px solid #dddbda;">
    <lightning-combobox variant="label-hidden" label="Guarantee Type"
        value={row.Guarantor_Type__c}
        options={section.guarantorTypeOptions}
        placeholder="-- None --"
        data-fld="Guarantor_Type__c"
        data-type={section.guarantorType}
        data-id={rowIdx}
        onchange={onGuarantorChange}>
    </lightning-combobox>
</td>
                            <!-- Primary Owner checkbox — borrower only -->
                            <template if:true={section.isBorrower}>
                                <td style="padding:2px;border:1px solid #dddbda;text-align:center;">
                                    <lightning-input type="checkbox" variant="label-hidden" label="Primary Owner"
                                        checked={row.Primary_Owner__c}
                                        data-fld="Primary_Owner__c"
                                        data-type={section.guarantorType}
                                        data-id={rowIdx}
                                        onchange={onGuarantorChange}>
                                    </lightning-input>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>
</template>

                                </lightning-accordion-section>
                            </template>
                        </lightning-accordion>
                    </template>

                    <!-- PAGE 2 -->
                    <template if:true={isPage2}>
                        <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                            <template for:each={currentSections} for:item="section">
                                <lightning-accordion-section key={section.key} name={section.key} label={section.accordionLabel} class="uw-acc-section">

                                    <template if:true={section.isEmpty}>
                                        <p class="uw-empty-msg slds-p-around_medium">{section.emptyMsg}</p>
                                    </template>

                                    <template if:true={section.isFieldSet}>
                                        <div class="slds-grid slds-wrap slds-gutters slds-p-around_small">
                                            <template for:each={section.fields} for:item="field">
                                                <div key={field.uid} class={field.colCss}>

                                                    <template if:true={field.isLookup}>
                                                        <lightning-record-picker
                                                            label={field.label}
                                                            object-api-name="User"
                                                            value={field.value}
                                                            required={field.required}
                                                            disabled={field.isDisabled}
                                                            data-obj={field.objectApiName}
                                                            data-fld={field.apiName}
                                                            onchange={onLookupChange}>
                                                        </lightning-record-picker>
                                                    </template>

                                                    <template if:true={field.isText}>
                                                        <lightning-input label={field.label} type={field.inputType} value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isNumber}>
                                                        <lightning-input label={field.label} type="number" value={field.value} required={field.required} disabled={field.isDisabled} formatter={field.formatter} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isBoolean}>
                                                        <lightning-input label={field.label} type="checkbox" checked={field.boolVal} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onCheckbox}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isDate}>
                                                        <lightning-input label={field.label} type="date" value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isDatetime}>
                                                        <lightning-input label={field.label} type="datetime-local" value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isTextarea}>
                                                        <lightning-textarea label={field.label} value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-textarea>
                                                    </template>

                                                    <template if:true={field.isPicklist}>
                                                        <lightning-combobox label={field.label} value={field.value} options={field.picklistOptions} required={field.required} disabled={field.isDisabled} placeholder="— Select —" data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-combobox>
                                                    </template>

                                                    <template if:true={field.isMultiPicklist}>
                                                        <lightning-dual-listbox label={field.label} source-label="Available" selected-label="Selected" options={field.picklistOptions} value={field.multiVal} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onMultiPicklist}></lightning-dual-listbox>
                                                    </template>

                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                </lightning-accordion-section>
                            </template>
                        </lightning-accordion>
                    </template>

                    <!-- PAGE 3 -->
                    <template if:true={isPage3}>
                        <lightning-accordion allow-multiple-sections-open active-section-name={activeSections}>
                            <template for:each={currentSections} for:item="section">
                                <lightning-accordion-section key={section.key} name={section.key} label={section.accordionLabel} class="uw-acc-section">

                                    <template if:true={section.isEmpty}>
                                        <p class="uw-empty-msg slds-p-around_medium">{section.emptyMsg}</p>
                                    </template>

                                    <template if:true={section.isFieldSet}>
                                        <div class="slds-grid slds-wrap slds-gutters slds-p-around_small">
                                            <template for:each={section.fields} for:item="field">
                                                <div key={field.uid} class={field.colCss}>

                                                    <template if:true={field.isLookup}>
                                                        <lightning-record-picker
                                                            label={field.label}
                                                            object-api-name="User"
                                                            value={field.value}
                                                            required={field.required}
                                                            disabled={field.isDisabled}
                                                            data-obj={field.objectApiName}
                                                            data-fld={field.apiName}
                                                            onchange={onLookupChange}>
                                                        </lightning-record-picker>
                                                    </template>

                                                    <template if:true={field.isText}>
                                                        <lightning-input label={field.label} type={field.inputType} value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isNumber}>
                                                        <lightning-input label={field.label} type="number" value={field.value} required={field.required} disabled={field.isDisabled} formatter={field.formatter} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isBoolean}>
                                                        <lightning-input label={field.label} type="checkbox" checked={field.boolVal} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onCheckbox}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isDate}>
                                                        <lightning-input label={field.label} type="date" value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isDatetime}>
                                                        <lightning-input label={field.label} type="datetime-local" value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-input>
                                                    </template>

                                                    <template if:true={field.isTextarea}>
                                                        <lightning-textarea label={field.label} value={field.value} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-textarea>
                                                    </template>

                                                    <template if:true={field.isPicklist}>
                                                        <lightning-combobox label={field.label} value={field.value} options={field.picklistOptions} required={field.required} disabled={field.isDisabled} placeholder="— Select —" data-obj={field.objectApiName} data-fld={field.apiName} onchange={onFieldChange}></lightning-combobox>
                                                    </template>

                                                    <template if:true={field.isMultiPicklist}>
                                                        <lightning-dual-listbox label={field.label} source-label="Available" selected-label="Selected" options={field.picklistOptions} value={field.multiVal} required={field.required} disabled={field.isDisabled} data-obj={field.objectApiName} data-fld={field.apiName} onchange={onMultiPicklist}></lightning-dual-listbox>
                                                    </template>

                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                </lightning-accordion-section>
                            </template>
                        </lightning-accordion>
                    </template>

                </div>

                <!-- FOOTER -->
                <div style="display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:8px;padding:10px 16px;background:#ffffff;border-top:1px solid #dddbda;flex-shrink:0;">
                    <template if:false={isFirstPage}>
                        <lightning-button label="Back" variant="neutral" disabled={isSaving} onclick={onBack}></lightning-button>
                    </template>

                    <template if:false={isLastPage}>
                        <lightning-button label="Next" variant="brand" disabled={isSaving} onclick={onNext}></lightning-button>
                    </template>

                    <template if:true={isLastPage}>
                        <lightning-button label="Submit" variant="brand" disabled={isSaving} onclick={onSubmit}></lightning-button>
                    </template>
                </div>

            </template>
        </div>
    </div>
</template>
